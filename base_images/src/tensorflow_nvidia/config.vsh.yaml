name: base_tensorflow_nvidia
description: |
  A Python 3.12 image with GPU-enabled TensorFlow and anndata preinstalled.

  nvcr.io stopped publishing TensorFlow images after 25.02, so this image is
  built on the same `python:3.12` base as `base_python`. The CUDA and cuDNN
  runtimes come from the `and-cuda` extra, which pins them to whatever the
  TensorFlow wheel was built against -- installing TensorFlow on a base image
  that ships its own CUDA lets the two drift apart and silently fall back to
  the CPU.
test_resources:
  - type: python_script
    path: test_tensorflow.py
  - type: python_script
    path: ../python/test_anndata.py
engines:
  - type: docker
    image: python:3.12
    setup:
      # hnswlib and annoy publish no wheels and their setup.py compiles with
      # `-march=native`, so whether an image runs anywhere depends on which CPU
      # the build landed on. Pin the ISA instead of inheriting the builder's.
      - type: docker
        env:
          - HNSWLIB_NO_NATIVE=1
          - CFLAGS=-march=x86-64-v3
          - CXXFLAGS=-march=x86-64-v3
          - CPPFLAGS=-march=x86-64-v3
          - ANNOY_COMPILER_ARGS=-D_CRT_SECURE_NO_WARNINGS,-fpermissive,-march=x86-64-v3,-O3,-ffast-math,-fno-associative-math,-DANNOYLIB_MULTITHREADED_BUILD,-std=c++14
      - type: apt
        packages:
          - procps
          - git
      - type: python
        packages:
          - tensorflow[and-cuda]~=2.21.0
          - anndata~=0.12.0
          - scanpy~=1.12
          - pyyaml
          - requests
          - jsonschema
        github:
          - openproblems-bio/core#subdirectory=packages/python/openproblems
      # TensorFlow does not find the CUDA libraries that the `and-cuda` extra
      # installs under `site-packages/nvidia/*/lib`, so put them on the linker
      # path. Without this it silently falls back to the CPU.
      - type: docker
        run: |
          find "$(python -c 'import nvidia, os; print(os.path.dirname(nvidia.__file__))')" -maxdepth 2 -name lib -type d > /etc/ld.so.conf.d/nvidia-pip.conf && \
            test -s /etc/ld.so.conf.d/nvidia-pip.conf && \
            ldconfig
