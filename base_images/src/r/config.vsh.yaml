name: base_r
description: An R2U image with anndata preinstalled.
test_resources:
  - type: r_script
    path: test_anndatar.R
  - type: python_script
    path: ../python/test_anndata.py
engines:
  - type: docker
    image: rocker/r2u:24.04
    setup:
      # hnswlib and annoy publish no wheels and their setup.py compiles with
      # `-march=native`, so whether an image runs anywhere depends on which CPU
      # the build landed on. Pin the ISA instead of inheriting the builder's.
      - type: docker
        env:
          - PIP_BREAK_SYSTEM_PACKAGES=1
          - RETICULATE_PYTHON=/usr/bin/python
          - HNSWLIB_NO_NATIVE=1
          - CFLAGS=-march=x86-64-v3
          - CXXFLAGS=-march=x86-64-v3
          - CPPFLAGS=-march=x86-64-v3
          - ANNOY_COMPILER_ARGS=-D_CRT_SECURE_NO_WARNINGS,-fpermissive,-march=x86-64-v3,-O3,-ffast-math,-fno-associative-math,-DANNOYLIB_MULTITHREADED_BUILD,-std=c++14
      - type: apt
        packages:
          - git
          - procps
          - libhdf5-dev
          - libgeos-dev
          - python3-pip
          - python3-dev
          - python-is-python3
      - type: python
        user: true
        packages:
          - rpy2
          - anndata~=0.12.0
          - scanpy~=1.12
          - pyyaml
          - requests
          - jsonschema
        github:
          - openproblems-bio/core#subdirectory=packages/python/openproblems
      - type: r
        packages:
          - anndata
          - BiocManager
          - reticulate
          - bit64
          - hdf5r
        bioc:
          - rhdf5
          - anndataR
        github:
          - openproblems-bio/core/packages/r/openproblems
    test_setup:
      - type: r
        packages:
          - testthat
