name: base_pytorch_nvidia
description: An nvcr.io pytorch with anndata preinstalled.
test_resources:
  - type: python_script
    path: test_pytorch.py
  - type: python_script
    path: test_cmake.py
  - type: python_script
    path: ../python/test_anndata.py
engines:
  - type: docker
    image: nvcr.io/nvidia/pytorch:26.02-py3
    setup:
      # hnswlib and annoy publish no wheels and their setup.py compiles with
      # `-march=native`, so whether an image runs anywhere depends on which CPU
      # the build landed on. Pin the ISA instead of inheriting the builder's.
      - type: docker
        env:
          - HNSWLIB_NO_NATIVE=1
          - CFLAGS=-march=x86-64-v3
          - CXXFLAGS=-march=x86-64-v3
          - CPPFLAGS=-march=x86-64-v3
          - ANNOY_COMPILER_ARGS=-D_CRT_SECURE_NO_WARNINGS,-fpermissive,-march=x86-64-v3,-O3,-ffast-math,-fno-associative-math,-DANNOYLIB_MULTITHREADED_BUILD,-std=c++14
      - type: apt
        packages:
          - procps
          - git
          - cmake
      # The nvcr image pip-installs cmake, whose shims in /usr/local/bin shadow
      # apt's cmake because /usr/local/bin comes first on PATH. Drop the package
      # so builds pick up the working /usr/bin/cmake instead.
      - type: docker
        run: pip uninstall -y cmake
      - type: python
        packages:
          - anndata~=0.12.0
          - scanpy~=1.12
          - requests
          - jsonschema
        github:
          - openproblems-bio/core#subdirectory=packages/python/openproblems
