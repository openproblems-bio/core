[tox]
requires =
    tox>=4
env_list = lint, type, py{310,311,312,313}

[testenv]
description = run unit tests
deps =
    pytest>=7
    pytest-sugar
    requests
    anndata
    mudata
    spatialdata; python_version >= "3.12"
    zarr
commands =
    pytest {posargs:tests}

[testenv:lint]
description = run linters
skip_install = true
deps =
    black==22.12
commands = black {posargs:--check --diff .}

[testenv:type]
description = run type checks
deps =
    mypy>=0.991
    pytest>=7
commands =
    mypy {posargs:src tests}
